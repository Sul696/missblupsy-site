<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miss Blupsy 🫧</title>
<meta name="description" content="Miss Blupsy: a little bubble that lives on your screen and gives AI a body. Works with any AI app that supports MCP.">
<meta property="og:title" content="Miss Blupsy 🫧">
<meta property="og:description" content="A body for AI: a little bubble on your screen that hears you, opens your apps, points, and edits your files.">
<meta property="og:image" content="https://missblupsy.com/icon-512.png">
<meta property="og:url" content="https://missblupsy.com/">
<link rel="canonical" href="https://missblupsy.com/">
<meta name="theme-color" content="#f7f3ff">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ff; --bg2:#eef6ff; --ink:#1a1d4a; --soft:#585c8a; --card:#ffffffd9; --line:#1a1d4a14;
  --pink:#ff6fae; --violet:#8f7bff; --sky:#4cc3ff; --mint:#44d6a6;
  --brand:linear-gradient(120deg,var(--pink),var(--violet) 45%,var(--sky));
  --shadow:0 18px 50px -20px #1a1d4a40, 0 0 0 1px var(--line);
  --head:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12132b; --bg2:#151a36; --ink:#eef0ff; --soft:#a8acd6; --card:#1d2045d9; --line:#ffffff1a;
    --shadow:0 18px 50px -20px #000a, 0 0 0 1px var(--line); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);line-height:1.7;
  background:radial-gradient(1200px 700px at 85% -10%,#ff6fae22,transparent 60%),
             radial-gradient(900px 600px at 0% 20%,#4cc3ff22,transparent 60%),
             linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;min-height:100vh;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--head);line-height:1.25;margin:0}
h2{font-size:clamp(28px,4vw,40px);text-align:center;margin-bottom:10px}
.lead{color:var(--soft);text-align:center;max-width:640px;margin:0 auto 36px;font-size:18px}
section{padding:72px 0}
.promo{display:block;width:100%;max-width:960px;margin:18px auto 0;border-radius:18px;box-shadow:0 18px 50px rgba(30,40,120,.18);background:#dcecff;aspect-ratio:16/9}

/* top bar */
.bar{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:20px;text-decoration:none}
.logo img{width:34px;height:34px}
.bar nav{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.bar nav a{text-decoration:none;color:var(--soft);padding:6px 10px;border-radius:10px;font-weight:500}
.bar nav a:hover{color:var(--ink);background:var(--line)}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;
  font:600 14px var(--body);cursor:pointer}
@media (max-width:720px){.bar nav a.hide-sm{display:none}}

/* hero */
.hero{padding:70px 0 40px;text-align:center;position:relative}
.badge{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:99px;background:var(--card);
  box-shadow:var(--shadow);font-weight:600;font-size:14px;color:var(--soft)}
.badge b{background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1{font-size:clamp(44px,8vw,86px);margin:18px 0 6px;letter-spacing:-.5px}
.hero h1 span{background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:var(--head);font-size:clamp(22px,3.4vw,32px);font-weight:700;margin:0}
.sub{color:var(--soft);font-size:18px;max-width:620px;margin:12px auto 30px}
.cta{display:flex;flex-direction:column;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;border:0;cursor:pointer;
  font:700 19px var(--head);padding:15px 28px;border-radius:18px;color:#fff;background:var(--brand);
  box-shadow:0 14px 34px -12px #8f7bffaa;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 18px 40px -12px #8f7bffcc}
.btn small{font:500 13px var(--body);opacity:.9}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-size:16px;padding:11px 20px}
.alt{font-size:14px;color:var(--soft)}
.alt a{color:var(--soft)}
.quote{margin:38px auto 0;font-family:var(--head);font-size:22px;color:var(--soft)}

/* how */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s}
.step{background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--shadow);position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-14px;inset-inline-start:20px;width:34px;height:34px;
  border-radius:50%;background:var(--brand);color:#fff;font:800 18px/34px var(--head);text-align:center}
.step h3{font-size:21px;margin:8px 0 6px}
.step p{margin:0;color:var(--soft)}
kbd{font:600 13px ui-monospace,monospace;background:var(--line);padding:2px 7px;border-radius:7px;white-space:nowrap}

/* features */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.f{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow);transition:transform .2s}
.f:hover{transform:translateY(-3px)}
.f .i{font-size:30px;line-height:1}
.f h3{font-size:19px;margin:10px 0 4px}
.f p{margin:0;color:var(--soft);font-size:15.5px}

/* try it */
.try{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center}
.code{background:#191b3d;color:#e9ebff;border-radius:20px;padding:18px 0;box-shadow:var(--shadow);direction:ltr;
  font:14.5px/1.9 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;overflow:hidden}
.code .ln{display:block;padding:0 20px;white-space:pre}
.code .n{color:#7d80b8;user-select:none;display:inline-block;width:26px}
.code .k{color:#ff8ec7}.code .s{color:#9be7c4}.code .c{color:#7d80b8}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts .pill{font-size:15px;padding:10px 16px}
.acts .pill:hover{border-color:var(--violet)}
.note{color:var(--soft);font-size:15px;margin-top:12px}

/* safety */
.safe{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:880px;margin:0 auto}
.safe div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.safe span{font-size:24px;line-height:1.3}
.safe p{margin:0}

/* downloads */
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.os{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.os.mine{outline:2.5px solid var(--violet)}
.os h3{font-size:22px;display:flex;gap:8px;align-items:center}
.os .tag2{font:600 12px var(--body);color:#fff;background:var(--violet);border-radius:99px;padding:2px 9px;margin-inline-start:auto}
.os a.file{display:flex;justify-content:space-between;gap:8px;text-decoration:none;padding:10px 14px;border-radius:14px;
  background:var(--line);font-weight:600}
.os a.file:hover{background:color-mix(in srgb,var(--violet) 18%,transparent)}
.os a.file small{color:var(--soft);font-weight:500}
.ext{margin-top:16px;display:flex;align-items:center;gap:16px;background:var(--card);border-radius:22px;padding:20px 22px;box-shadow:var(--shadow)}
.ext .i{font-size:34px}
.ext p{margin:2px 0 0;color:var(--soft)}
.ext .btn{margin-inline-start:auto;font-size:16px;padding:11px 20px}
details.warn{max-width:880px;margin:22px auto 0;background:var(--card);border-radius:18px;padding:14px 18px;box-shadow:var(--shadow)}
details.warn summary{cursor:pointer;font-weight:600}

/* faq */
.faq{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq details{background:var(--card);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow)}
.faq summary{cursor:pointer;font-weight:600;font-size:17px}
.faq p{margin:8px 0 0;color:var(--soft)}

footer{padding:40px 0 60px;text-align:center;color:var(--soft);font-size:14px}

@media (max-width:860px){
  .steps,.grid,.dl{grid-template-columns:1fr 1fr}
  .try{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .steps,.grid,.dl,.safe{grid-template-columns:1fr}
  section{padding:52px 0}
  .ext{flex-wrap:wrap}.ext .btn{margin-inline-start:0}
}
/* the stage she flies on: the whole window, clicks pass through except on her */
#stage{position:fixed;inset:0;pointer-events:none;z-index:40}
.hit-flash{animation:flash 1s ease}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}40%{box-shadow:0 0 0 4px var(--pink),var(--shadow)}}
</style>
</head>

<div id="stage" aria-hidden="false"></div>

<header class="bar">
  <div class="wrap">
    <a class="logo" href="#top"><img src="icon-512.png" alt="">Miss Blupsy</a>

<main id="top">

  <section id="watch">

    </div>
  </section>

  <section id="how">
    <div class="wrap">
      <h2 data-t="how.t"></h2>
      <p class="lead" data-t="how.d"></p>
      <div class="steps">
        <div class="step"><h3 data-t="how.1t"></h3><p data-t="how.1d"></p></div>

      </div>
    </div>
  </section>

  <section id="features">
    <div class="wrap">
      <h2 data-t="f.t"></h2>
      <p class="lead" data-t="f.d"></p>
      <div class="grid" id="featureGrid"></div>
    </div>
  </section>

  <section id="try">
    <div class="wrap">
      <h2 data-t="try.t"></h2>
      <p class="lead" data-t="try.d"></p>
      <div class="try">
        <div class="code" id="code"></div>
        <div>
          <div class="acts">
            <button class="pill" data-act="mistake" data-t="try.mistake"></button>
            <button class="pill" data-act="wave" data-t="try.wave"></button>
            <button class="pill" data-act="clap" data-t="try.clap"></button>
            <button class="pill" data-act="bubbles" data-t="try.bubbles"></button>
            <button class="pill" data-act="sound" data-t="try.sound"></button>
          </div>
          <p class="note" data-t="try.note"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="safety">
    <div class="wrap">
      <h2 data-t="s.t"></h2>
      <p class="lead" data-t="s.d"></p>
      <div class="safe" id="safeList"></div>
    </div>
  </section>

  <section id="download">
    <div class="wrap">
      <h2 data-t="d.t"></h2>
      <p class="lead" data-t="d.d"></p>
      <div class="dl" id="dlGrid"></div>
      <div class="ext">
        <div class="i">🧩</div>
        <div><b data-t="d.extT"></b><p data-t="d.extD"></p></div>
        <a class="btn" id="extBtn" data-t="d.extBtn"></a>
      </div>
      <details class="warn">
        <summary data-t="d.warnT"></summary>
        <p data-t="d.warnWin"></p>
        <p data-t="d.warnMac"></p>
      </details>
    </div>
  </section>

  <section id="faq">
    <div class="wrap">
      <h2 data-t="q.t"></h2>
      <div class="faq" id="faqList"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p data-t="foot"></p>
    <p><a href="about.html">About</a> · <a href="help.html">Help</a> · <a href="privacy.html">Privacy</a> · <a href="mailto:sultan.alenezi@missblupsy.com">Contact</a> · <a href="https://github.com/Sul696/missblupsy-site/issues">Support</a></p>
    <p>© 2026 Miss Blupsy · Founded by Sultan Alenezi · Saudi Arabia</p>
    <p>© Miss Blupsy</p>
  </div>
</footer>

        ['⚙️', 'جهازك بكلمة', '«شغلي الوضع الليلي»، «اقفلي الشاشة»، «كم مساحة الجهاز؟»، «كم الساعة في لندن؟»، «صحيني الساعة ٦». بدون ذكاء ولا نت.'],

      safe: [

        ['هل صوتي يطلع من جهازي؟', 'لا. السمع يصير على جهازك نفسه، وبعد أول تحميل يشتغل بدون نت. إلا لو شغّلت بنفسك «السمع عبر الإنترنت» (مقفل افتراضياً): وقتها التسجيل يروح لـ Groq بمفتاحك عشان يتحول لنص.'],

      'w.t': 'See her at work', 'how.t': 'Three steps to start', 'how.d': 'All you need is an AI app that supports MCP (like Claude), or a key from the Claude Console, or a free key like Gemini.',

      ],
      safe: [
        ['🙋', 'She asks before anything that matters: looking at the screen, clicking, opening a file.'],

        ['🚫', 'No AI API key inside: nothing to leak.'],
      ],
      faq: [
        ['Is she free?', 'Yes, the app and the extension are free. The AI runs on your own account in its app.'],
        ['What do I need?', 'An AI app that supports MCP (like Claude, Cursor, Windsurf or VS Code), and a Windows, Mac or Linux computer.'],
        ['Which AI does she work with?', 'She is an MCP tool, so any app that supports MCP: Claude, Cursor, Windsurf, VS Code and more. She links herself to them.'],
        ['Does she always see my screen?', 'No. Only when the AI asks and you agree (or allowed it from the start). Banking windows are never captured.'],
        ['Does my voice leave my computer?', 'No. Listening happens on your computer, and works offline after the first download. Only if you turn on online hearing yourself (off by default) is the recording sent to Groq, with your own key, to be turned into text.'],
      ],
    },
  };

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let lang = 'ar';
  try { lang = localStorage.getItem('mb-lang') || ''; } catch { lang = ''; }
  if (!T[lang]) lang = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
  const t = (k, v) => String(T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, n) => (v && v[n]) ?? '');

  // ── which computer is this ──
  let os = null, arm = false;
  const ua = navigator.userAgent || '';
  const plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  if (/win/i.test(plat) || /Windows/.test(ua)) os = 'win';
  else if (/mac/i.test(plat) || /Mac OS X/.test(ua)) os = /iPhone|iPad/.test(ua) || navigator.maxTouchPoints > 1 ? null : 'mac';
  else if (/linux/i.test(plat) && !/Android/.test(ua)) os = 'linux';
  if (os === 'mac') arm = true; // almost every Mac sold since 2020; Intel is one click away
  if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
    navigator.userAgentData.getHighEntropyValues(['architecture']).then((v) => {
      if (os === 'win' && v.architecture === 'arm') { arm = true; render(); }
      if (os === 'mac' && v.architecture === 'x86') { arm = false; render(); }
    }).catch(() => {});
  }
  const primaryFile = () => !os ? null : os === 'win' ? FILES.win[arm ? 1 : 0] : os === 'mac' ? FILES.mac[arm ? 0 : 1] : FILES.linux[0];

  // ── page text ──
  function render() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    $('#lang').textContent = lang === 'ar' ? 'English' : 'العربية';
    for (const el of $$('[data-t]')) el.innerHTML = t(el.dataset.t);
    const p = primaryFile();
    $('#mainDlText').textContent = p ? t('hero.dl', { os: t('os.' + os) }) : t('hero.dlAny');
    $('#mainDl').href = p ? FILE(p[0]) : '#download';
    $('#mainAlt').innerHTML = t('hero.alt');
    $('#featureGrid').innerHTML = T[lang].features.map(([i, h, d]) => `<div class="f"><div class="i">${i}</div><h3>${esc(h)}</h3><p>${esc(d)}</p></div>`).join('');
    $('#safeList').innerHTML = T[lang].safe.map(([i, d]) => `<div><span>${i}</span><p>${esc(d)}</p></div>`).join('');
    $('#faqList').innerHTML = T[lang].faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
    const icons = { win: '🪟', mac: '🍎', linux: '🐧' };
    $('#dlGrid').innerHTML = ['win', 'mac', 'linux'].map((k) => `
      <div class="os${k === os ? ' mine' : ''}" id="os-${k}">
        <h3>${icons[k]} ${t('os.' + k)}${k === os ? `<span class="tag2">${t('d.mine')}</span>` : ''}</h3>
        ${FILES[k].map(([f, label]) => `<a class="file" href="${FILE(f)}"><span>${label}</span><small>${f.split('.').pop()}</small></a>`).join('')}
      </div>`).join('');
    $('#extBtn').href = FILE(EXT);
    if (b) b.lines = Object.assign({}, b.lines, T[lang].lines);
  }

  // a sample with one mistake in it, for her to find
  const CODE = [
    ['c', '// check the password length'],
    ['', 'function strong(pw) {'],
    ['', '  if (pw.length < 12) return false;'],
    ['bug', '  if (pw = "") return false;'],
    ['', '  return /[0-9]/.test(pw);'],
    ['', '}'],
  ];
  const paint = (s) => esc(s).replace(/\b(function|return|if)\b/g, '<span class="k">$1</span>').replace(/(&quot;.*?&quot;|\/\[0-9\]\/)/g, '<span class="s">$1</span>');
  $('#code').innerHTML = CODE.map(([k, s], i) => `<span class="ln"${k === 'bug' ? ' id="bug"' : ''}><span class="n">${i + 1}</span>${k === 'c' ? `<span class="c">${esc(s)}</span>` : paint(s)}</span>`).join('');

  // ── her ──
  const stage = $('#stage');
  const small = () => innerWidth < 560;
  // quiet until the visitor turns her sound on
  const sound = typeof BlupsySound === 'function' ? new BlupsySound({ voice: 'babble', night: false }) : null;
  if (sound) sound.mute(true);
  let b = null;
  try {
    b = new MissBlupsy(stage, {
      sound, size: small() ? 26 : 34, boredAfter: 40, sleepAfter: 120,
      font: '"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif',
      lines: T[lang].lines,
    });
  } catch (e) { b = null; }
  render();
  if (!b) return;

  // one thing at a time: what you ask waits its turn, her own remarks are skipped while she is busy
  let busy = 0;
  let chain = Promise.resolve();
  const job = (fn) => { busy += 1; chain = chain.then(fn).catch(() => {}).finally(() => { busy -= 1; }); return chain; };
  const center = (el, ax = 0.5, ay = 0.5) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width * ax, y: r.top + r.height * ay, r }; };
  const home = () => {
    const R = small() ? 26 : 34;
    return { x: document.documentElement.dir === 'rtl' ? R * 2.6 : innerWidth - R * 2.6, y: innerHeight - R * 3.2 };
  };
  const visible = (el) => { const r = el.getBoundingClientRect(); return r.top > 60 && r.bottom < innerHeight - 20; };

  // she says hello, then shows where to get her
  (async () => {
    await wait(500);
    const h = home();
    await b.enter(h.x, h.y, t('b.hello'));
    await wait(400);
    const btn = $('#mainDl');
    if (visible(btn)) await job(async () => {
      const c = center(btn, document.documentElement.dir === 'rtl' ? 1 : 0, 0.5);
      await b.pointAt(c.x, c.y, { say: primaryFile() ? t('b.point') : t('b.pointAny'), hold: 2600 });
      const back = home();
      await b.flyTo(back.x, back.y, { style: 'soft' });
    });
  })();

  // her eyes follow the mouse
  addEventListener('pointermove', (e) => b.setCursor(e.clientX, e.clientY), { passive: true });

  // a word for each part of the page, once, the first time it comes into view
  const said = new Set();
  const notes = { how: 'b.how', features: 'b.features', safety: 'b.safety', download: 'b.download' };
  const io = new IntersectionObserver((entries) => {
    for (const en of entries) {
      const id = en.target.id;
      if (!en.isIntersecting || said.has(id) || busy) continue;
      said.add(id);
      job(async () => {
        const h2 = en.target.querySelector('h2');
        const c = center(h2);
        const side = document.documentElement.dir === 'rtl' ? -1 : 1;
        const x = Math.max(60, Math.min(innerWidth - 60, c.x + side * (c.r.width / 2 + 70)));
        await b.flyTo(x, Math.max(90, c.y), { style: 'soft' });
        if (id === 'download' && os) $('#os-' + os).classList.add('hit-flash');
        await b.say(t(notes[id]), { hold: 2200 });
        const h = home();
        await b.flyTo(h.x, h.y, { style: 'soft' });
      });
    }
  }, { threshold: 0.45 });
  for (const id of Object.keys(notes)) io.observe(document.getElementById(id));

  // when you go for a download, she looks
  for (const a of $$('#dlGrid a, #mainDl, #extBtn')) a.addEventListener('pointerenter', () => { const c = center(a); b.lookAt(c.x, c.y); setTimeout(() => b.lookAt(null), 1200); });

  // the "try her" buttons
  const acts = {
    async mistake() {
      const bug = $('#bug');
      bug.scrollIntoView({ behavior: 'smooth', block: 'center' });
      await wait(450);
      const r = bug.getBoundingClientRect();
      const code = $('#code').getBoundingClientRect();
      await b.markMistake({ x: code.left + 46, y: r.top, w: Math.min(r.width - 60, 250), h: r.height }, t('b.mistake'));
    },
    async wave() { await b.wave(1600); },
    async clap() { await b.clap(1400); },
    async bubbles() { for (let i = 0; i < 4; i++) { b.blowBubble(); await wait(260); } },
    async sound(btn) {
      if (!sound) return;
      sound.unlock();
      const on = sound.muted;
      sound.mute(!on);
      btn.textContent = on ? '🔇' : t('try.sound');
      await b.say(on ? t('b.sound') : t('b.soundOff'));
    },
  };
  for (const btn of $$('[data-act]')) btn.addEventListener('click', () => job(() => acts[btn.dataset.act](btn)));

  $('#lang').addEventListener('click', () => {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('mb-lang', lang); } catch { /* private window */ }
    render();
    const h = home();
    job(async () => { await b.flyTo(h.x, h.y, { style: 'soft' }); await b.say(t('b.claude')); });
  });

  // her red circle belongs to a spot on the page: it goes when the page moves
  addEventListener('scroll', () => b.clearMarks(), { passive: true });
  addEventListener('resize', () => { if (!busy) { const h = home(); b.flyTo(h.x, h.y, { style: 'soft' }); } });
})();
</script>
